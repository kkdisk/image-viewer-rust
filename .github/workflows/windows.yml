name: Windows 檢查與發布建置

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: 取得原始碼
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 安裝 Rust 工具
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: 格式檢查
        run: cargo fmt --all --check
      - name: 靜態分析
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: 工作區測試
        run: cargo test --workspace --locked
      - name: 發布建置
        run: cargo build --release -p app-ui --locked
      - name: 打包並核對版本與體積
        run: ./scripts/package_windows.ps1
      - name: 保存 Windows 建置產物
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: 下載本次已驗證產物並建立發布草稿
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --name windows-x64 --dir dist
          if ($LASTEXITCODE -ne 0) { throw '下載產物失敗' }
          $assets = @(Get-ChildItem -LiteralPath dist -File | ForEach-Object { $_.FullName })
          gh release create $env:GITHUB_REF_NAME @assets --repo $env:GITHUB_REPOSITORY --draft --verify-tag --generate-notes --title $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) { throw '建立發布草稿失敗' }
