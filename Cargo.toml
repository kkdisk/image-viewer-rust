[workspace]
resolver = "3"
members = [
    "crates/core-image",
    "crates/core-archive",
    "crates/duplicate-finder",
    "crates/viewer-state",
    "crates/app-ui",
]

[workspace.package]
version = "0.5.2"
edition = "2024"
rust-version = "1.99.1"
authors = ["Image Viewer Contributors"]
license = "MIT"

[workspace.dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "gif", "tiff", "webp"] }
rayon = "1.10"
tokio = { version = "1.40", features = ["full"] }
thiserror = "2.0"
anyhow = "1.0"
kamadak-exif = "0.5"
md-5 = "0.10"
trash = "5.2"
sevenz-rust = { version = "0.6", features = ["aes256"] }
zip = "2.2"
tempfile = "3.13"
rfd = "0.15"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
